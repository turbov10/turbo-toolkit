[package]
name = "calculator"
version = "0.1.0"
description = "Cross-platform Calculator desktop wrapper"
authors = ["turbo-toolkit"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.11.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
